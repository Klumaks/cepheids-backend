<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Атлас цефеид — добавление</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>
    <div class="app">
        <div class="page">
            <h1 class="page-title">Добавление класса</h1>

            <section class="block">
                <h2 class="block-label">Медиафайлы</h2>
                <div class="media-row">
                    <figure>
                        <label class="media-upload">
                            <input type="file" accept="image/*" hidden>
                            <span class="media-icon">&#128247;</span>
                            <span class="media-label">Выбрать изображение</span>
                        </label>
                        <figcaption>Изображение</figcaption>
                    </figure>
                    <figure>
                        <label class="media-upload">
                            <input type="file" accept="video/*" hidden>
                            <span class="media-icon">&#9654;</span>
                            <span class="media-label">Выбрать видео</span>
                        </label>
                        <figcaption>Видео</figcaption>
                    </figure>
                </div>
            </section>

            <section class="block">
                <h2 class="block-label">Идентификация</h2>
                <label class="field-label">Название</label>
                <input class="field" placeholder="Введите название класса" value="">
                <label class="field-label">Описание</label>
                <input class="field" placeholder="Введите краткое описание" value="">
            </section>

            <section class="block">
                <h2 class="block-label">Математические параметры</h2>
                <label class="field-label">Наклон a</label>
                <input class="field" type="number" step="0.01" placeholder="Например, -2.75">
                <label class="field-label">Свободный член b</label>
                <input class="field" type="number" step="0.01" placeholder="Например, -1.30">
            </section>


        </div>

        <nav class="tabbar">
            <a href="/feed"><span class="tab-icon">&#8801;</span>Лента</a>
            <a href="/add" class="active"><span class="tab-icon">+</span>Добавление</a>
            <a href="/classes"><span class="tab-icon">&#8862;</span>Плитка</a>
        </nav>
    </div>
</body>

</html>
