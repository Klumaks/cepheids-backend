<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Атлас цефеид — плитка</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>

<body>
    <div class="app">
        <div class="page">
            <h1 class="page-title">Плитка</h1>

            <form class="filter" action="/classes" method="GET">
                <div class="filter-group">
                    <label class="filter-label">
                        Наклон a: от <output id="min_slope_out">{{ or .MinSlope `-5` }}</output>
                        до <output id="max_slope_out">{{ or .MaxSlope `0` }}</output>
                    </label>
                    <div class="range-row">
                        <input type="range" name="min_slope" min="-5" max="0" step="0.01"
                            value="{{ or .MinSlope `-5` }}"
                            oninput="document.getElementById('min_slope_out').value=this.value">
                        <input type="range" name="max_slope" min="-5" max="0" step="0.01" value="{{ or .MaxSlope `0` }}"
                            oninput="document.getElementById('max_slope_out').value=this.value">
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label">
                        Свободный член b: от <output id="min_b_out">{{ or .MinB `-5` }}</output>
                        до <output id="max_b_out">{{ or .MaxB `0` }}</output>
                    </label>
                    <div class="range-row">
                        <input type="range" name="min_b" min="-5" max="0" step="0.01" value="{{ or .MinB `-5` }}"
                            oninput="document.getElementById('min_b_out').value=this.value">
                        <input type="range" name="max_b" min="-5" max="0" step="0.01" value="{{ or .MaxB `0` }}"
                            oninput="document.getElementById('max_b_out').value=this.value">
                    </div>
                </div>

                <button class="btn btn-block" type="submit">Найти</button>
            </form>

            <div class="grid">
                {{ range .Cards }}
                <div class="card-wrapper">
                    <a class="card" href="/feed/{{ .ID }}">
                        <img src="{{ .ImageURL }}" alt="{{ .Name }}">
                        <h3>{{ .Name }}</h3>
                        <p class="card-param">Наклон a = {{ .SlopeStr }}</p>
                        <p class="card-param">Свободный член b = {{ .InterceptStr }}</p>
                        <p class="card-like">&#9829; {{ .LikesCount }}</p>
                    </a>
                    <form action="/classes/delete" method="POST" class="delete-form">
                        <input type="hidden" name="class_id" value="{{ .ID }}">
                        <button class="btn btn-block" type="submit">Удалить</button>
                    </form>
                </div>
                {{ end }}
            </div>
        </div>

        <nav class="tabbar">
            <a href="/feed"><span class="tab-icon">&#8801;</span>Лента</a>
            <a href="/add"><span class="tab-icon">+</span>Добавление</a>
            <a href="/classes" class="active"><span class="tab-icon">&#8862;</span>Плитка</a>
        </nav>
    </div>
</body>

</html>
