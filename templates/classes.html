<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Атлас цефеид — плитка</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="app">
        <div class="page">
            <h1 class="page-title">Плитка</h1>

            <form class="filter" action="/classes" method="GET">
                <input class="field" type="number" step="0.01" name="min_slope" placeholder="Наклон a от"
                       value="{{ .MinSlope }}">
                <input class="field" type="number" step="0.01" name="max_slope" placeholder="Наклон a до"
                       value="{{ .MaxSlope }}">
                <input class="field" type="number" step="0.01" name="min_b" placeholder="Свободный член b от"
                       value="{{ .MinB }}">
                <input class="field" type="number" step="0.01" name="max_b" placeholder="Свободный член b до"
                       value="{{ .MaxB }}">
                <button class="btn" type="submit">Найти</button>
            </form>

            <div class="grid">
                {{ range .Cards }}
                <div class="card-wrapper">
                    <a class="card" href="/feed/{{ .ID }}">
                        <img src="{{ .ImageURL }}" alt="{{ .Name }}">
                        <h3>{{ .Name }}</h3>
                        <p class="card-param">Наклон a = {{ .Slope }}</p>
                        <p class="card-param">Свободный член b = {{ .Intercept }}</p>
                        <p class="card-like">&#9829; {{ .LikesCount }}</p>
                    </a>
                    <form action="/classes/delete" method="POST" class="delete-form">
                        <input type="hidden" name="class_id" value="{{ .ID }}">
                        <button class="delete-btn" type="submit">Удалить</button>
                    </form>
                </div>
                {{ end }}
            </div>
        </div>

        <nav class="tabbar">
            <a href="/feed"><span class="tab-icon">&#8801;</span>Лента</a>
            <a href="/add"><span class="tab-icon">+</span>Добавление</a>
            <a href="/classes" class="active"><span class="tab-icon">&#8862;</span>Плитка</a>
        </nav>
    </div>
</body>
</html>
